name: Build APK MadaGestion

on:
  push:
    branches: [main, master]
    tags: ["v*"]          # un tag comme v0.4.0 publie aussi une Release GitHub
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compiler MadaGestion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # nécessaire seulement pour créer la Release sur un tag

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accepter les licences du SDK Android
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Installer Gradle 8.9 (avec cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Lancer les tests unitaires
        run: gradle testDebugUnitTest --stacktrace

      - name: Compiler l'APK debug
        run: gradle assembleDebug --stacktrace

      - name: Nommer l'APK avec la version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MadaGestion-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MadaGestion-${{ steps.apk.outputs.version }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier les schémas Room (à garder dans le dépôt pour les migrations)
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/**
          if-no-files-found: ignore

      - name: Créer la Release GitHub (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-erreurs
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
